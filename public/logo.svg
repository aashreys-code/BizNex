<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1A2E"/>
      <stop offset="1" stop-color="#0A1525"/>
    </linearGradient>
    <linearGradient id="line" x1="100" y1="320" x2="380" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5A623"/>
      <stop offset="0.35" stop-color="#7ED957"/>
      <stop offset="0.7" stop-color="#2EE8A5"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A3A50"/>
      <stop offset="1" stop-color="#0F2535"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E4460"/>
      <stop offset="1" stop-color="#122D42"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#234F6E"/>
      <stop offset="1" stop-color="#15364F"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#285A7C"/>
      <stop offset="1" stop-color="#183F5C"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Bar chart (4 bars, left to right, increasing height) -->
  <rect x="168" y="310" width="32" height="70" rx="6" fill="url(#bar1)" opacity="0.8"/>
  <rect x="218" y="270" width="32" height="110" rx="6" fill="url(#bar2)" opacity="0.85"/>
  <rect x="268" y="230" width="32" height="150" rx="6" fill="url(#bar3)" opacity="0.9"/>
  <rect x="318" y="190" width="32" height="190" rx="6" fill="url(#bar4)" opacity="0.95"/>

  <!-- Rising line chart -->
  <polyline
    points="120,330 200,220 270,270 380,140"
    stroke="url(#line)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Orange dot (start) -->
  <circle cx="120" cy="330" r="14" fill="#F5A623"/>
  <circle cx="120" cy="330" r="7" fill="#FFD166"/>

  <!-- Cyan dot (end) -->
  <circle cx="380" cy="140" r="18" fill="#00D4FF"/>
  <circle cx="380" cy="140" r="8" fill="#FFFFFF"/>

  <!-- "BizPulse" text -->
  <text x="256" y="440" text-anchor="middle" font-family="Poppins, Inter, system-ui, sans-serif" font-weight="700" font-size="72">
    <tspan fill="#FFFFFF">Biz</tspan><tspan fill="#2EE8A5">Pulse</tspan>
  </text>
</svg>
