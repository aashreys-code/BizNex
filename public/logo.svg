<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="mainGrad" x1="50" y1="400" x2="420" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CF5C1"/>
      <stop offset="0.5" stop-color="#21F1A8"/>
      <stop offset="1" stop-color="#1AD692"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="300" y1="200" x2="420" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#21F1A8"/>
      <stop offset="1" stop-color="#5CF5C1"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CF5C1"/>
      <stop offset="1" stop-color="#1AD692"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main zigzag chart line with arrow -->
  <!-- Line starts bottom-left, zigzags up to top-right with arrow -->
  <g filter="url(#glow)">
    <!-- Main thick zigzag path -->
    <path
      d="M80 400 L160 280 L260 340 L360 160 L440 80"
      stroke="url(#mainGrad)"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Arrow head at the end -->
    <polygon
      points="440,80 380,80 440,20"
      fill="url(#arrowGrad)"
    />
    <polygon
      points="440,80 440,20 380,80"
      fill="none"
      stroke="url(#arrowGrad)"
      stroke-width="2"
    />

    <!-- Data point dots at vertices -->
    <circle cx="80" cy="400" r="14" fill="url(#dotGrad)"/>
    <circle cx="80" cy="400" r="7" fill="#0A3D2E" opacity="0.3"/>

    <circle cx="160" cy="280" r="14" fill="url(#dotGrad)"/>
    <circle cx="160" cy="280" r="7" fill="#0A3D2E" opacity="0.3"/>

    <circle cx="260" cy="340" r="14" fill="url(#dotGrad)"/>
    <circle cx="260" cy="340" r="7" fill="#0A3D2E" opacity="0.3"/>

    <circle cx="360" cy="160" r="14" fill="url(#dotGrad)"/>
    <circle cx="360" cy="160" r="7" fill="#0A3D2E" opacity="0.3"/>
  </g>
</svg>
