<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="lineGrad" x1="60" y1="420" x2="440" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0099FF"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="340" y1="160" x2="440" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0099FF"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>

  <!-- Zigzag growth line -->
  <path
    d="M70 400 L150 260 L250 320 L340 140 L430 60"
    stroke="url(#lineGrad)"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Arrow head -->
  <path
    d="M430 60 L370 60 L430 0 Z"
    fill="url(#arrowGrad)"
  />

  <!-- Data point dots -->
  <circle cx="70" cy="400" r="16" fill="#0099FF"/>
  <circle cx="70" cy="400" r="8" fill="#00D4FF" opacity="0.6"/>

  <circle cx="150" cy="260" r="16" fill="#0099FF"/>
  <circle cx="150" cy="260" r="8" fill="#00D4FF" opacity="0.6"/>

  <circle cx="250" cy="320" r="16" fill="#0099FF"/>
  <circle cx="250" cy="320" r="8" fill="#00D4FF" opacity="0.6"/>

  <circle cx="340" cy="140" r="16" fill="#00AAFF"/>
  <circle cx="340" cy="140" r="8" fill="#00D4FF" opacity="0.6"/>
</svg>
