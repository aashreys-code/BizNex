<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="starGrad" x1="120" y1="80" x2="392" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F2A3E"/>
      <stop offset="1" stop-color="#0A1C2E"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="180" y1="380" x2="350" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2196F3"/>
      <stop offset="1" stop-color="#42A5F5"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="310" y1="280" x2="380" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7E57C2"/>
      <stop offset="1" stop-color="#AB47BC"/>
    </linearGradient>
  </defs>

  <!-- 5-pointed star shape (dark navy) -->
  <path d="
    M256 60
    L295 185
    L420 185
    L318 262
    L355 390
    L256 310
    L157 390
    L194 262
    L92 185
    L217 185
    Z
  " fill="url(#starGrad)" stroke="#1A3A50" stroke-width="2"/>

  <!-- Circuit line path with dots -->
  <path d="M200 360 C200 300, 230 260, 256 240 C282 220, 260 180, 240 160"
    stroke="url(#circuitGrad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>

  <path d="M240 160 C260 140, 290 170, 310 160"
    stroke="url(#circuitGrad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Circuit nodes (dots) -->
  <circle cx="200" cy="360" r="10" fill="#2196F3"/>
  <circle cx="200" cy="360" r="5" fill="#64B5F6"/>

  <circle cx="256" cy="240" r="10" fill="#2196F3"/>
  <circle cx="256" cy="240" r="5" fill="#64B5F6"/>

  <circle cx="240" cy="160" r="10" fill="#2196F3"/>
  <circle cx="240" cy="160" r="5" fill="#64B5F6"/>

  <circle cx="310" cy="160" r="10" fill="#2196F3"/>
  <circle cx="310" cy="160" r="5" fill="#64B5F6"/>

  <!-- Secondary circuit path -->
  <path d="M180 320 C200 280, 220 300, 230 270 C240 240, 270 250, 280 230"
    stroke="#1E88E5" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <circle cx="180" cy="320" r="8" fill="#1E88E5" opacity="0.7"/>
  <circle cx="180" cy="320" r="4" fill="#64B5F6" opacity="0.7"/>

  <circle cx="230" cy="270" r="8" fill="#1E88E5" opacity="0.7"/>
  <circle cx="230" cy="270" r="4" fill="#64B5F6" opacity="0.7"/>

  <circle cx="280" cy="230" r="8" fill="#1E88E5" opacity="0.7"/>
  <circle cx="280" cy="230" r="4" fill="#64B5F6" opacity="0.7"/>

  <!-- Rising arrow (purple) -->
  <line x1="290" y1="280" x2="370" y2="130" stroke="url(#arrowGrad)" stroke-width="10" stroke-linecap="round"/>
  <polygon points="370,130 348,155 360,165" fill="#AB47BC"/>
  <polygon points="370,130 355,140 365,155" fill="#CE93D8" opacity="0.8"/>
</svg>
