<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004741"/>
      <stop offset="100%" stop-color="#006b5e"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21F1A8"/>
      <stop offset="100%" stop-color="#5CF5C1"/>
    </linearGradient>
  </defs>
  <!-- Circular arc -->
  <path d="M 40 140 A 62 62 0 1 1 150 42"
        fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round"/>
  <!-- Inner ring -->
  <path d="M 52 138 A 50 50 0 1 1 142 50"
        fill="none" stroke="url(#arc)" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
  <!-- Bar chart -->
  <rect x="68" y="108" width="11" height="28" rx="2" fill="url(#arc)"/>
  <rect x="83" y="88"  width="11" height="48" rx="2" fill="url(#arc)"/>
  <rect x="98" y="68"  width="11" height="68" rx="2" fill="url(#arc)"/>
  <!-- Arrow -->
  <line x1="103" y1="65" x2="148" y2="22"
        stroke="url(#arrow)" stroke-width="7" stroke-linecap="round"/>
  <polygon points="148,18 158,32 143,32" fill="url(#arrow)"/>
</svg>
