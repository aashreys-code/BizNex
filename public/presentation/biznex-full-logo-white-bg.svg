<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" fill="none">
  <rect width="560" height="120" rx="12" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21F1A8"/>
      <stop offset="100%" stop-color="#5CF5C1"/>
    </linearGradient>
  </defs>
  <!-- Icon -->
  <g transform="translate(20, 10) scale(0.5)">
    <path d="M 40 140 A 62 62 0 1 1 150 42" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 52 138 A 50 50 0 1 1 142 50" fill="none" stroke="url(#arc)" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
    <rect x="68" y="108" width="11" height="28" rx="2" fill="url(#arc)"/>
    <rect x="83" y="88"  width="11" height="48" rx="2" fill="url(#arc)"/>
    <rect x="98" y="68"  width="11" height="68" rx="2" fill="url(#arc)"/>
    <line x1="103" y1="65" x2="148" y2="22" stroke="url(#arrow)" stroke-width="7" stroke-linecap="round"/>
    <polygon points="148,18 158,32 143,32" fill="url(#arrow)"/>
  </g>
  <!-- Text -->
  <text x="140" y="78" font-family="Manrope, Inter, system-ui, sans-serif" font-weight="800" font-size="56" letter-spacing="-1.5">
    <tspan fill="#1a1a1a">Biz</tspan><tspan fill="#21F1A8">Nex</tspan>
  </text>
</svg>
